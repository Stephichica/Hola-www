<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <!--Header: Es la cabecera del body-->
    <header>
        <h1>Formulario</h1>
    </header>
    <!--Formulario-->
    <div>
        <form action="../index.html" method="post">
            <div>
                <!--Label: Me permite ingresar a un texto fijo-->
                <label for="Nombre">Ingrese el Nombre</label>
                <!--impud: Caja para ingresar texto-->
                <input type="text" id="Nombre">
            </div>
            <br>
            <div>
                <!--Label: Me permite ingresar a un texto fijo-->
                <label for="Edad">Ingrese la Edad</label>
                <!--impud: Caja para ingresar texto-->
                <input type="number" id="Edad">
            </div>
            <br>
            <div>
                <!--Label: Me permite ingresar a un texto fijo-->
                <label for="Dirección">Ingrese la Dirección</label>
                <!--impud: Caja para ingresar texto-->
                <input type="text" id="Dirección">
            </div>
            <br>
            <div>
                <!--Label: Me permite ingresar a un texto fijo-->
                <label for="Corre">Ingrese Correo Electrónico</label>
                <!--impud: Caja para ingresar texto-->
                <input type="email" id="Correo">
            </div>
            <br>
            <!--Boton submit: me permite enviar la petición o información-->
            <div>
                <input type="submit" value="Enviar">
            </div>
            <br>
            <div>
                <a href="../index.html"> Ir a casa</a>
            </div>
            
        </form>
    </div>
    
</body>
</html>
